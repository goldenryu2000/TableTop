name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Signing secrets not set; skipping release build"
      - uses: actions/setup-java@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: env.KEYSTORE_BASE64 != ''
      - uses: gradle/actions/setup-gradle@v4
        if: env.KEYSTORE_BASE64 != ''
      - name: Write signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
      - run: ./gradlew test assembleRelease
        if: env.KEYSTORE_BASE64 != ''
      - name: Publish APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="tabletop-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Tabletop $TAG" --generate-notes
          gh release upload "$TAG" "$apk" --clobber
